[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://emqx:1883"]
  topics = [
    "sinergi/iiot/+/+"
  ]
  qos = 1
  data_format = "json"
  name_override = "iiot"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "sinergi/iiot/+/+"
    tags = "_/_/gateway_id/node_id"

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  path = "/metrics"
  expiration_interval = "120s"

