groups:
- name: iiotsystem
  rules:
  - alert: TemperatureWarning
    expr: iiot_temperature > 28
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: "High temperature on {{ $labels.gateway_id }}"
      description: "Node {{ $labels.node_id }} reported temperature {{ $value }} for more than 30 seconds."

  - alert: TemperatureCritical
    expr: iiot_temperature > 35
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "High temperature on {{ $labels.gateway_id }}"
      description: "Node {{ $labels.node_id }} reported temperature {{ $value }} for more than 30 seconds."

  - alert: HumidityWarning
    expr: iiot_humidity > 64
